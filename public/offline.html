<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Gala Dock</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f8f9fb; color: #141828; }
    .card { text-align: center; max-width: 360px; padding: 2rem; }
    .dot { width: 48px; height: 48px; border-radius: 9999px; background: #eef2ff; color: #4f46e5;
      display: inline-flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 1rem; }
    h1 { font-size: 1.1rem; margin: 0 0 .4rem; }
    p { font-size: .9rem; color: #5a5d70; margin: 0 0 1.25rem; }
    button { background: #4f46e5; color: #fff; border: 0; border-radius: .6rem; padding: .6rem 1.1rem;
      font-size: .9rem; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <div class="dot">⚡</div>
    <h1>You're offline</h1>
    <p>Gala Dock can't reach the network right now. Cached pages still work — reconnect to sync your changes.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
