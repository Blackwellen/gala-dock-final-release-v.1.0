<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b64f5">
<title>You’re offline · Gala Dock</title>
<style>
:root{--ink:#0c1034;--muted:#626e9e;--blue:#075bff;--bg:#f7f9fd;--card:#fff;--border:#e8edf9}
@media (prefers-color-scheme:dark){:root{--ink:#eef1ff;--muted:#a9b1d6;--bg:#0b1024;--card:#141a35;--border:#262e52}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px max(16px,env(safe-area-inset-left))}
main{max-width:440px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px 24px;text-align:center}
img{width:56px;height:56px;border-radius:14px}
h1{font-size:24px;margin:16px 0 8px;letter-spacing:-.02em}
p{color:var(--muted);margin:0 0 20px}
button{font:inherit;font-weight:600;color:#fff;background:linear-gradient(110deg,#175bff,#6130ff);border:0;border-radius:10px;padding:12px 20px;min-height:44px;cursor:pointer}
</style>
</head>
<body>
<main>
<img src="/icons/icon-192.png" alt="Gala Dock">
<h1>You’re offline</h1>
<p>Signing in, payments and saving need a connection. Reconnect to load your account. Any changes you have not saved may need to be entered again.</p>
<button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
